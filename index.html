<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nathan — Official</title>

<style>
:root{
  --bg:#071a18;
  --card:#0d2521;
  --line:rgba(255,255,255,.1);
  --text:#f7f9ff;
  --muted:#9caeaa;
  --blue:#1689ff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:#071a18;
  overflow-x:hidden;
}

/* TOP NAV */

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  justify-content:flex-end;
  padding:16px 18px;
  background:linear-gradient(
    to bottom,
    rgba(7,26,24,.96),
    rgba(7,26,24,.55),
    transparent
  );
  backdrop-filter:blur(14px);
}

.tabs{
  display:flex;
  gap:4px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(8,25,23,.85);
}

.tab{
  border:0;
  color:var(--muted);
  background:transparent;
  padding:9px 15px;
  border-radius:999px;
  cursor:pointer;
  font-weight:700;
  font-size:13px;
}

.tab.active{
  color:#fff;
  background:#ffffff12;
}

/* PAGE */

.page{
  width:min(680px,calc(100% - 28px));
  margin:auto;
  padding:24px 0 55px;
}

.hero{
  text-align:center;
  padding:12px 0 22px;
}

.avatar{
  width:104px;
  height:104px;
  border-radius:50%;
  margin:0 auto 17px;
  display:grid;
  place-items:center;
  font-size:35px;
  font-weight:900;
  background:#102d29;
  border:1px solid rgba(255,255,255,.16);
  box-shadow:
    0 0 0 6px rgba(50,180,160,.06),
    0 18px 50px rgba(0,0,0,.45);
}

h1{
  margin:0;
  font-size:30px;
  letter-spacing:-1px;
}

.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:14px;
}

/* BLUE CHECK */

.verified{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:18px;
  height:18px;
  border-radius:50%;
  margin-left:5px;
  background:#1689ff;
  color:#fff;
  font-size:11px;
  font-weight:900;
  vertical-align:3px;
}

.verified:after,
.check:after{
  content:"✓";
}

/* WEBSITE VIEWS */

.stats{
  margin:18px 0;
}

.stat{
  border:1px solid var(--line);
  background:rgba(13,37,33,.78);
  backdrop-filter:blur(18px);
  padding:14px;
  border-radius:18px;
  text-align:center;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.2px;
}

.views{
  margin-top:4px;
  font-size:22px;
  font-weight:850;
}

/* SOCIAL BUTTONS */

.links{
  display:grid;
  gap:12px;
}

.social{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-decoration:none;
  color:#fff;
  padding:17px 18px;
  border-radius:18px;
  border:1px solid var(--line);
  background:rgba(13,37,33,.78);
  backdrop-filter:blur(18px);
  transition:.18s ease;
}

.social:hover{
  transform:translateY(-2px);
  border-color:rgba(50,190,170,.45);
  background:rgba(18,43,39,.9);
}

.left{
  display:flex;
  align-items:center;
  gap:14px;
}

.app-icon{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  overflow:hidden;
  flex:none;
}

.app-icon img{
  width:28px;
  height:28px;
  object-fit:contain;
}

.tiktok .app-icon{
  background:#000;
}

.instagram .app-icon{
  background:linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );
}

.snapchat .app-icon{
  background:#fffc00;
}

.handle{
  font-size:15px;
  font-weight:750;
  text-align:left;
}

.followers{
  display:block;
  margin-top:4px;
  color:#899b99;
  font-size:12px;
  font-weight:600;
}

.check{
  display:inline-grid;
  place-items:center;
  width:17px;
  height:17px;
  margin-left:5px;
  border-radius:50%;
  background:#1689ff;
  font-size:10px;
  font-weight:900;
  vertical-align:1px;
}

.arrow{
  color:#6f8580;
  font-size:22px;
}

/* SCREENS */

.screen{
  display:none;
  min-height:70vh;
}

.screen.active{
  display:block;
}

.blog{
  min-height:70vh;
}

/* PROFILE */

.profile{
  text-align:center;
  padding:38px 0;
}

.profile-icon{
  width:112px;
  height:112px;
  margin:0 auto 24px;
  border-radius:28px;
  display:grid;
  place-items:center;
  box-shadow:0 25px 70px rgba(0,0,0,.4);
}

.profile-icon img{
  width:68px;
  height:68px;
}

.profile-icon.tiktok{
  background:#000;
}

.profile-icon.instagram{
  background:linear-gradient(
    135deg,
    #833ab4,
    #fd1d1d,
    #fcb045
  );
}

.profile-icon.snapchat{
  background:#fffc00;
}

.profile h2{
  font-size:31px;
  margin:0;
}

.profile p{
  color:var(--muted);
  margin:9px 0 5px;
}

.open-app{
  display:block;
  width:100%;
  padding:16px;
  margin-top:22px;
  border-radius:16px;
  background:#fff;
  color:#071a18;
  text-decoration:none;
  font-weight:800;
}

.back{
  border:1px solid var(--line);
  background:rgba(13,37,33,.78);
  color:#fff;
  padding:10px 15px;
  border-radius:999px;
  cursor:pointer;
  font-weight:700;
}

/* 3D POPUP */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.74);
  backdrop-filter:blur(12px);
  perspective:1400px;
}

.modal.show{
  display:flex;
}

/*
  IMPORTANT:
  The iframe itself is the 3D object.
*/

.modal-stage{
  width:min(430px,94vw);
  height:min(620px,82vh);
  position:relative;
}

.social-3d-iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;

  border:1px solid rgba(255,255,255,.16);
  border-radius:26px;

  background:#071a18;

  box-shadow:
    0 35px 100px rgba(0,0,0,.65),
    0 0 0 1px rgba(255,255,255,.03);

  overflow:hidden;

  transform:
    rotateX(0deg)
    rotateY(0deg)
    scale(.92);

  transform-style:preserve-3d;

  transition:transform .12s ease-out;

  touch-action:none;
  user-select:none;
}

/* POPUP CONTROLS */

.modal-controls{
  position:absolute;
  top:14px;
  left:14px;
  right:14px;
  z-index:5;
  display:flex;
  justify-content:space-between;
  align-items:center;
  pointer-events:none;
}

.modal-title{
  padding:9px 13px;
  border-radius:999px;
  background:rgba(0,0,0,.62);
  backdrop-filter:blur(12px);
  font-size:13px;
  font-weight:800;
}

.modal-close{
  width:38px;
  height:38px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:50%;
  color:#fff;
  background:rgba(0,0,0,.62);
  cursor:pointer;
  font-size:20px;
  pointer-events:auto;
}

.hint{
  position:absolute;
  z-index:5;
  bottom:73px;
  left:0;
  right:0;
  text-align:center;
  color:rgba(255,255,255,.72);
  font-size:11px;
  pointer-events:none;
}

.continue{
  position:absolute;
  z-index:6;
  bottom:18px;
  left:18px;
  right:18px;
  border:0;
  border-radius:16px;
  padding:15px;
  background:#fff;
  color:#071a18;
  font-weight:850;
  cursor:pointer;
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

/* FOOTER */

footer{
  text-align:center;
  color:#586f6a;
  font-size:11px;
  margin-top:28px;
}

/* MOBILE */

@media(max-width:480px){

  .topbar{
    padding:12px;
  }

  .page{
    width:calc(100% - 20px);
    padding-top:14px;
  }

  .avatar{
    width:92px;
    height:92px;
  }

  h1{
    font-size:27px;
  }

  .tab{
    padding:8px 12px;
  }

  .modal-stage{
    height:80vh;
  }
}
</style>
</head>


<body>

<!-- NAVIGATION -->

<nav class="topbar">

  <div class="tabs">

    <button
      class="tab active"
      id="socialTab"
      onclick="showMain('social')">

      Socials

    </button>


    <button
      class="tab"
      id="blogTab"
      onclick="showMain('blog')">

      Personal Blog

    </button>

  </div>

</nav>


<main class="page">


<!-- MAIN SOCIAL PAGE -->

<section id="socialPage">

  <header class="hero">

    <div class="avatar">
      N
    </div>


    <h1>

      nathan

      <span class="verified"></span>

    </h1>


    <p class="subtitle">
      Official social hub
    </p>

  </header>


<!-- WEBSITE VIEWS -->

<section class="stats">

  <div class="stat">

    <div class="stat-label">
      Website Views
    </div>

    <div
      class="views"
      id="viewCounter">

      2,000

    </div>

  </div>

</section>


<!-- SOCIAL LINKS -->

<div class="links">


<!-- TIKTOK -->

<a
  class="social tiktok"
  href="#"
  onclick="openSocialPreview(event,'tiktok-roox')">

  <span class="left">

    <span class="app-icon">

      <img
        src="https://cdn.simpleicons.org/tiktok/ffffff"
        alt="TikTok">

    </span>


    <span class="handle">

      @roox

      <span class="check"></span>

      <span class="followers">
        655,000 followers
      </span>

    </span>

  </span>


  <span class="arrow">
    ›
  </span>

</a>


<!-- INSTAGRAM -->

<a
  class="social instagram"
  href="#"
  onclick="openSocialPreview(event,'instagram-rebt')">

  <span class="left">

    <span class="app-icon">

      <img
        src="https://cdn.simpleicons.org/instagram/ffffff"
        alt="Instagram">

    </span>


    <span class="handle">

      @rebt

      <span class="check"></span>

      <span class="followers">
        31,000 followers
      </span>

    </span>

  </span>


  <span class="arrow">
    ›
  </span>

</a>


<!-- SNAPCHAT -->

<a
  class="social snapchat"
  href="#"
  onclick="openSocialPreview(event,'snapchat-ncthvn')">

  <span class="left">

    <span class="app-icon">

      <img
        src="https://cdn.simpleicons.org/snapchat/000000"
        alt="Snapchat">

    </span>


    <span class="handle">

      @ncthvn

      <span class="check"></span>

      <span class="followers">
        47,700,000 Snapscore
      </span>

    </span>

  </span>


  <span class="arrow">
    ›
  </span>

</a>

</div>

</section>


<!-- BLANK BLOG -->

<section
  id="blogPage"
  class="screen blog">
</section>


<!-- PROFILE PAGE -->

<section
  id="profilePage"
  class="screen">

  <button
    class="back"
    onclick="goHome()">

    ← Back

  </button>


  <div class="profile">

    <div
      id="profileIcon"
      class="profile-icon">

      <img
        id="profileIconImg"
        src=""
        alt="">

    </div>


    <h2 id="profileHandle"></h2>


    <p id="profileName"></p>


    <div
      id="profileFollowers"
      class="followers"
      style="font-size:14px;margin-bottom:22px;">

    </div>


    <a
      id="openApp"
      class="open-app"
      href=""
      target="_blank"
      rel="noopener">

      Open Profile

    </a>

  </div>

</section>


<!-- 3D IFRAME POPUP -->

<div
  class="modal"
  id="socialModal"
  aria-hidden="true">


  <div class="modal-stage">


    <!-- THE IFRAME ITSELF IS THE 3D OBJECT -->

    <iframe
      class="social-3d-iframe"
      id="socialFrame"
      title="Social media preview">

    </iframe>


    <div class="modal-controls">

      <div
        class="modal-title"
        id="modalTitle">

        Social Preview

      </div>


      <button
        class="modal-close"
        onclick="closeSocialPreview()">

        ×

      </button>

    </div>


    <div class="hint">
      Drag the card to spin
    </div>


    <button
      class="continue"
      onclick="continueToMain()">

      Continue

    </button>

  </div>

</div>


<footer>

  © 2026 Nathan · All links in one place

</footer>

</main>


<script>

/* SOCIAL DATA */

const profiles = {

  "tiktok-roox":{

    platform:"TikTok",

    handle:"@roox",

    url:"https://www.tiktok.com/@roox",

    icon:"https://cdn.simpleicons.org/tiktok/ffffff",

    className:"tiktok",

    followers:"655,000 followers"

  },


  "instagram-rebt":{

    platform:"Instagram",

    handle:"@rebt",

    url:"https://www.instagram.com/rebt",

    icon:"https://cdn.simpleicons.org/instagram/ffffff",

    className:"instagram",

    followers:"31,000 followers"

  },


  "snapchat-ncthvn":{

    platform:"Snapchat",

    handle:"@ncthvn",

    url:"https://www.snapchat.com/add/ncthvn",

    icon:"https://cdn.simpleicons.org/snapchat/000000",

    className:"snapchat",

    followers:"47,700,000 Snapscore"

  }

};


/* MAIN TABS */

function showMain(page){

  if(page === "blog"){

    document
      .getElementById("socialPage")
      .style.display="none";

    document
      .getElementById("profilePage")
      .classList.remove("active");

    document
      .getElementById("blogPage")
      .classList.add("active");

    document
      .getElementById("socialTab")
      .classList.remove("active");

    document
      .getElementById("blogTab")
      .classList.add("active");

    history.replaceState(
      null,
      "",
      "#blog"
    );

  }else{

    goHome();

  }

}


/* HOME */

function goHome(){

  document
    .getElementById("socialPage")
    .style.display="block";

  document
    .getElementById("profilePage")
    .classList.remove("active");

  document
    .getElementById("blogPage")
    .classList.remove("active");

  document
    .getElementById("socialTab")
    .classList.add("active");

  document
    .getElementById("blogTab")
    .classList.remove("active");

  history.replaceState(
    null,
    "",
    "#social"
  );

}


/* INDIVIDUAL PROFILE */

function showProfile(id){

  const profile =
    profiles[id];

  if(!profile){

    goHome();

    return;

  }


  document
    .getElementById("socialPage")
    .style.display="none";

  document
    .getElementById("blogPage")
    .classList.remove("active");

  document
    .getElementById("profilePage")
    .classList.add("active");


  const iconBox =
    document.getElementById("profileIcon");


  iconBox.className =
    "profile-icon " +
    profile.className;


  document
    .getElementById("profileIconImg")
    .src =
    profile.icon;


  document
    .getElementById("profileHandle")
    .innerHTML =
    profile.handle +
    ' <span class="verified"></span>';


  document
    .getElementById("profileName")
    .textContent =
    profile.platform;


  document
    .getElementById("profileFollowers")
    .textContent =
    profile.followers;


  document
    .getElementById("openApp")
    .href =
    profile.url;


  history.replaceState(
    null,
    "",
    "#" + id
  );

}


/* 3D IFRAME */

const modal =
  document.getElementById("socialModal");


const modalFrame =
  document.getElementById("socialFrame");


const modalTitle =
  document.getElementById("modalTitle");


let activeSocial=null;

let dragging=false;

let startX=0;

let startY=0;

let rotX=0;

let rotY=0;


/* OPEN SOCIAL */

function openSocialPreview(event,id){

  event.preventDefault();


  const profile =
    profiles[id];


  if(!profile)
    return;


  activeSocial=id;


  modalTitle.textContent =
    profile.platform +
    " · " +
    profile.handle;


  /*
    The iframe contains the complete
    social preview.

    The iframe element itself is
    the object being rotated.
  */

  modalFrame.srcdoc = `

<!DOCTYPE html>

<html>

<head>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  display:grid;

  place-items:center;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:white;

  background:#071a18;

}


.card{

  width:82%;

  padding:38px 24px;

  text-align:center;

  border:
    1px solid
    rgba(255,255,255,.13);

  border-radius:28px;

  background:
    rgba(255,255,255,.055);

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.35);

  backdrop-filter:blur(18px);

}


.logo{

  width:92px;

  height:92px;

  margin:0 auto 22px;

  border-radius:25px;

  display:grid;

  place-items:center;

  font-size:42px;

  font-weight:900;

  background:

  ${
    profile.className==="snapchat"

    ? "#fffc00"

    :

    profile.className==="instagram"

    ? "linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045)"

    :

    "#000"

  };

  color:

  ${
    profile.className==="snapchat"

    ? "#000"

    :

    "#fff"

  };

}


h1{

  margin:0;

  font-size:27px;

}


p{

  color:#9ca7bb;

  margin:10px 0 0;

}


.verified{

  display:inline-grid;

  place-items:center;

  width:17px;

  height:17px;

  border-radius:50%;

  background:#1689ff;

  font-size:10px;

  vertical-align:3px;

}

</style>

</head>


<body>


<div class="card">


<div class="logo">

${
  profile.platform==="TikTok"
  ? "♪"
  :
  profile.platform==="Instagram"
  ? "◎"
  :
  "👻"
}

</div>


<h1>

${profile.handle}

<span class="verified">
✓
</span>

</h1>


<p>

${profile.followers}

</p>


</div>


</body>

</html>

`;


  modal.classList.add("show");

  modal.setAttribute(
    "aria-hidden",
    "false"
  );


  rotX=0;

  rotY=0;


  modalFrame.style.transform =
    "rotateX(0deg) rotateY(0deg) scale(1)";

}


/* CLOSE */

function closeSocialPreview(){

  modal.classList.remove("show");

  modal.setAttribute(
    "aria-hidden",
    "true"
  );

  modalFrame.srcdoc="";

  activeSocial=null;

}


/* CONTINUE */

function continueToMain(){

  closeSocialPreview();

  goHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* DRAG THE ACTUAL IFRAME */

function startDrag(x,y){

  dragging=true;

  startX=x;

  startY=y;

}


function moveDrag(x,y){

  if(!dragging)
    return;


  const dx =
    x-startX;


  const dy =
    y-startY;


  rotY +=
    dx*.35;


  rotX -=
    dy*.22;


  rotX =
    Math.max(
      -22,
      Math.min(
        22,
        rotX
      )
    );


  rotY =
    Math.max(
      -35,
      Math.min(
        35,
        rotY
      )
    );


  /*
    THE IFRAME ITSELF
    gets transformed.
  */

  modalFrame.style.transform =
    `rotateX(${rotX}deg)
     rotateY(${rotY}deg)
     scale(1)`;


  startX=x;

  startY=y;

}


/* MOUSE */

modalFrame.addEventListener(
  "mousedown",
  function(e){

    startDrag(
      e.clientX,
      e.clientY
    );

  }
);


window.addEventListener(
  "mousemove",
  function(e){

    moveDrag(
      e.clientX,
      e.clientY
    );

  }
);


window.addEventListener(
  "mouseup",
  function(){

    dragging=false;

  }
);


/* TOUCH */

modalFrame.addEventListener(
  "touchstart",
  function(e){

    const t =
      e.touches[0];

    startDrag(
      t.clientX,
      t.clientY
    );

  },
  {
    passive:true
  }
);


modalFrame.addEventListener(
  "touchmove",
  function(e){

    const t =
      e.touches[0];

    moveDrag(
      t.clientX,
      t.clientY
    );

  },
  {
    passive:true
  }
);


modalFrame.addEventListener(
  "touchend",
  function(){

    dragging=false;

  }
);


/* CLOSE WHEN CLICKING OUTSIDE */

modal.addEventListener(
  "click",
  function(e){

    if(e.target === modal){

      closeSocialPreview();

    }

  }
);


/* ESCAPE */

document.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Escape"){

      closeSocialPreview();

    }

  }
);


/* URL ROUTING */

function route(){

  const hash =
    location.hash.replace(
      "#",
      ""
    );


  if(profiles[hash]){

    showProfile(hash);

  }

  else if(hash === "blog"){

    showMain("blog");

  }

  else{

    goHome();

  }

}


window.addEventListener(
  "hashchange",
  route
);


route();


/* WEBSITE VIEW COUNTER */

const KEY =
  "nathan_site_views_started";


let started =
  localStorage.getItem(KEY);


if(!started){

  started =
    Date.now();

  localStorage.setItem(
    KEY,
    started
  );

}


function updateViews(){

  const elapsed =
    Math.max(
      0,
      Date.now() -
      Number(started)
    );


  const days =
    elapsed /
    86400000;


  const views =
    2000 +
    Math.floor(
      days *
      10000
    );


  document
    .getElementById(
      "viewCounter"
    )
    .textContent =
    views.toLocaleString(
      "en-US"
    );

}


updateViews();


setInterval(
  updateViews,
  1000
);

</script>
